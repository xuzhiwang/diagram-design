<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant work · Impact × Effort</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · Diagram Design</p>
    <h1>Assistant work · Impact × Effort</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="priority-quadrant-title priority-quadrant-desc">
      <title id="priority-quadrant-title">Assistant work · Impact × Effort</title>
      <desc id="priority-quadrant-desc">Impact-effort quadrant placing GitHub PR babysitting, inbox triage, diagram generation, and phone UI automation for assistant work.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Subtle DO FIRST wash (high impact, low effort) -->
      <rect x="140" y="72" width="360" height="176" fill="rgba(235,108,54,0.03)"/>

      <!-- Axis cross with arrow tips (Jobs-minimal labels beyond tips) -->
      <line x1="140" y1="248" x2="820" y2="248" stroke="rgba(45,49,66,0.45)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="424" x2="500" y2="72" stroke="rgba(45,49,66,0.45)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Axis labels: one word at each high tip, no glyphs -->
      <text x="500" y="56" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">IMPACT</text>
      <text x="844" y="252" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" dominant-baseline="middle" letter-spacing="0.18em">EFFORT</text>

      <!-- Quadrant corner tags -->
      <text x="160" y="96" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" font-weight="600">DO FIRST</text>
      <text x="840" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">MAJOR PROJECTS</text>
      <text x="160" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">QUICK WINS</text>
      <text x="840" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

      <!-- DO FIRST: GitHub PR babysitting (coral focal) -->
      <circle cx="240" cy="140" r="6" fill="#eb6c36"/>
      <text x="256" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">GitHub PR babysitting</text>

      <!-- MAJOR: Phone UI automation -->
      <circle cx="680" cy="160" r="4" fill="#2d3142"/>
      <text x="696" y="164" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Phone UI automation</text>

      <!-- QUICK WINS: Inbox -->
      <circle cx="280" cy="336" r="4" fill="#2d3142"/>
      <text x="296" y="340" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Inbox triage</text>

      <!-- Between DO FIRST and MAJOR: Diagram generation (high impact, moderate effort) -->
      <circle cx="420" cy="184" r="4" fill="#2d3142"/>
      <text x="436" y="188" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Diagram generation</text>

      <!-- Legend -->
      <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <circle cx="52" cy="492" r="6" fill="#eb6c36"/>
      <text x="68" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Do first</text>

      <circle cx="168" cy="492" r="4" fill="#2d3142"/>
      <text x="184" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Candidate work</text>

      <text x="320" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Position is the signal. Colour marks the single action item.</text>
    </svg>
  </div>
</body>
</html>
